<svg width="1000" height="450" viewBox="0 0 1000 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="containedBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="transparent" />

  <g filter="url(#containedBlur)">
    <circle cx="300" cy="180" r="110" fill="#94e2d5" opacity="0.6">
      <animate attributeName="cx" values="300;700;300" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" />
      <animate attributeName="cy" values="180;270;180" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" />
    </circle>

    <circle cx="700" cy="270" r="125" fill="#b4befe" opacity="0.5">
      <animate attributeName="cx" values="700;300;700" dur="10s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" />
      <animate attributeName="cy" values="270;180;270" dur="10s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" />
    </circle>

    <circle cx="500" cy="225" r="95" fill="#f5c2e7" opacity="0.5">
      <animate attributeName="cx" values="400;600;400" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" />
      <animate attributeName="r" values="95;140;95" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" />
    </circle>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold">
    
    <text x="500" y="205" font-size="75" text-anchor="middle" fill="#cdd6f4">
      Hi, I'm PerSki
    </text>
    
    <text x="500" y="255" font-size="20" text-anchor="middle" font-weight="normal" fill="#bac2de">
      Computer Science Student | CyberSec Enthusiast
    </text>
  </g>
</svg>
